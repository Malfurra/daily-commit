name: Daily Auto Commit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update timestamp file
        run: |
          date -u > last_updated.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "malfurra"
          git config --global user.email "mallownly@gmail.com"
          git add last_updated.txt
          git commit -m "chore: automated daily update $(date +'%Y-%m-%d')" || exit 0
          git push
